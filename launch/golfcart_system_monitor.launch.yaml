launch:
# Monitoring a sensor that is deliberately switched off reports it as failed.
# Indoors that is five GNSS rows permanently red, which teaches operators to
# ignore the monitor — the opposite of what a monitor is for.
- arg:
    name: use_gnss
    default: "true"
- arg:
    name: monitor_gps
    default: $(var use_gnss)

# The mode availability strip reads Autoware's diagnostic graph straight from
# the browser over rosbridge. The monitor node does not proxy it: the two graph
# topics disagree on QoS (struct is RELIABLE + TRANSIENT_LOCAL, status is
# BEST_EFFORT + VOLATILE) and rosbridge derives the profile per topic from the
# publishers, which a hand-written subscriber has to get right by hand and keep
# right through every Autoware upgrade.
#
# Off by default is wrong here: an operator who has to know to switch on the
# fault display does not have a fault display. Set launch_rosbridge:=false when
# something else already runs one on this host, or on a machine with no graph.
- arg:
    name: launch_rosbridge
    default: "true"
- arg:
    name: rosbridge_port
    default: "9090"

- group:
    if: $(var launch_rosbridge)
    children:
    - node:
        pkg: rosbridge_server
        exec: rosbridge_websocket
        name: golfcart_rosbridge
        param:
        -
          name: port
          value: $(var rosbridge_port)

- node:
    pkg: golfcart_system_monitor
    exec: golfcart_system_monitor_node.py
    name: golfcart_system_monitor
    param:
    -
      name: topics_config_file
      value: "$(find-pkg-share golfcart_system_monitor)/config/monitor_topics.yaml"
    -
      name: monitor_lidar
      value: true
    -
      name: monitor_camera
      value: true
    -
      name: monitor_imu
      value: true
    -
      name: monitor_gps
      value: $(var monitor_gps)
    -
      name: monitor_vehicle
      value: true
    -
      name: monitor_diagnostics
      value: true
    -
      name: report_interval_sec
      value: 5.0
    -
      name: web_server_host
      value: 0.0.0.0
    -
      name: web_server_port
      value: 8080
    -
      name: rosbridge_port
      value: $(var rosbridge_port)
